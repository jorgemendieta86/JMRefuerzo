    <rect x="670" y="100" width="80" height="30" rx="4" fill="#f5a623" transform="rotate(15 710 115)"/>
    <rect x="120" y="120" width="60" height="25" rx="4" fill="#0f3460" transform="rotate(-30 150 132)"/>
    <rect x="620" y="260" width="60" height="25" rx="4" fill="#533483" transform="rotate(30 650 272)"/>
  </g>
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666" letter-spacing="3">INSTITUCIÓN EDUCATIVA JOSÉ CARLOS MARIÁTEGUI — SOCCHABAMBA, AYABACA</text>
