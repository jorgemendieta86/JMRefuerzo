    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#accent2)" stroke-width="1" stroke-dasharray="4,6"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f5a623">=</text>
  </g>
  <g opacity="0.15">
