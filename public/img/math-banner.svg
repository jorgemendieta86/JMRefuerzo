<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5a623;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g opacity="0.05">
    <circle cx="100" cy="80" r="60" fill="none" stroke="#e94560" stroke-width="2"/>
    <circle cx="700" cy="320" r="80" fill="none" stroke="#f5a623" stroke-width="2"/>
    <circle cx="650" cy="60" r="40" fill="none" stroke="#0f3460" stroke-width="2"/>
    <circle cx="150" cy="350" r="50" fill="none" stroke="#533483" stroke-width="2"/>
  </g>
  <text x="400" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e94560" letter-spacing="8">REFUERZO MATEMÁTICO</text>
  <text x="400" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">OPERACIONES BÁSICAS</text>
  <text x="400" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a0a0b0">+  −  ×  ÷</text>
  <g transform="translate(400,260)" opacity="0.3">
